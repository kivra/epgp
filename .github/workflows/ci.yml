name: Automatic testing
on: [push]
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  OTP_VERSION: "29.1"
  REBAR3_VERSION: "3.27.0"

jobs:
  compile:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # {vsn, git} in epgp.app.src needs tags, else 0.0.0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "${{ env.OTP_VERSION }}"
          rebar3-version: "${{ env.REBAR3_VERSION }}"
      - name: Fetch workspace from cache
        uses: actions/cache@v6
        id: cached-workspace
        with:
          path: |
            _build/*/*/*
            ebin
          key: workspace-${{ github.ref }}
      - name: Compile
        run: rebar3 as test compile

  xref:
    needs: [compile]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # {vsn, git} in epgp.app.src needs tags, else 0.0.0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "${{ env.OTP_VERSION }}"
          rebar3-version: "${{ env.REBAR3_VERSION }}"
      - name: Fetch workspace from cache
        uses: actions/cache@v6
        id: cached-workspace
        with:
          path: |
            _build/*/*/*
            ebin
          key: workspace-${{ github.ref }}
      - name: Run xref
        run: rebar3 xref

  eunit:
    needs: [compile]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # {vsn, git} in epgp.app.src needs tags, else 0.0.0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "${{ env.OTP_VERSION }}"
          rebar3-version: "${{ env.REBAR3_VERSION }}"
      - name: Fetch workspace from cache
        uses: actions/cache@v6
        id: cached-workspace
        with:
          path: |
           _build/*/*/*
            ebin
          key: workspace-${{ github.ref }}
      - name: Run EUnit tests
        run: rebar3 eunit

  dialyzer:
    needs: [compile]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # {vsn, git} in epgp.app.src needs tags, else 0.0.0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "${{ env.OTP_VERSION }}"
          rebar3-version: "${{ env.REBAR3_VERSION }}"
      - name: Fetch workspace from cache
        uses: actions/cache@v6
        id: cached-workspace
        with:
          path: |
            _build/*/*/*
            ebin
          key: workspace-dialyzer-${{ github.ref }}
          restore-keys:
            workspace-${{ github.ref }}
      - name: Run Dialyzer
        run: rebar3 dialyzer

  test-compilation:
    runs-on: ubuntu-26.04
    name: Erlang/OTP ${{matrix.otp}} / rebar3 ${{matrix.rebar3}}
    strategy:
      matrix:
        otp: ["27", "28", "29"]
        rebar3: ["3.27.0"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # {vsn, git} in epgp.app.src needs tags, else 0.0.0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          rebar3-version: ${{matrix.rebar3}}
      - run: rebar3 ct

  versioner:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      releaseTag: ${{ steps.semver.outputs.nextStrict }}
    steps:
      # semver-action reads tags and commits over the GitHub API rather than
      # from the working tree, so this needs no history (and arguably no
      # checkout at all); it is kept only to give the job a workspace.
      - uses: actions/checkout@v7

      - name: Calculate Semantic Version
        id: semver
        # This decides whether we tag a release at all. An empty output means
        # no release: either we are not on the default branch, or the commit
        # opted out, or no commit since the last tag warranted a bump.
        if: github.ref_name == github.event.repository.default_branch && !startsWith(github.event.head_commit.message, 'no-release')
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: ${{ github.event.repository.default_branch }}
          # Tags in this repo are bare version numbers with no "v" prefix, so
          # the empty default prefix is correct for both reading and writing.
          skipInvalidTags: true
          # Conventional commits drive the bump. majorList stays empty: a major
          # bump comes from a "!" marker or a BREAKING CHANGE note. chore/docs/
          # build/ci are in patchList so renovate dependency bumps still release.
          minorList: feat, feature
          patchList: fix, bugfix, perf, refactor, test, tests, chore, docs, build, ci
          # Nothing releasable, or nothing new: say so and skip, do not fail CI.
          noVersionBumpBehavior: silent
          noNewCommitBehavior: silent

  release:
    needs: [versioner, xref, eunit, dialyzer, test-compilation]
    if: ${{ needs.versioner.outputs.releaseTag != '' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    # Releases must not overlap. The top-level concurrency group does not
    # cancel on main, so two quick pushes would otherwise compute the same
    # version and the second gh release create would fail with "already
    # exists". Not keyed on ref: one release at a time, repository wide.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.versioner.outputs.releaseTag }}" \
            --target "${{ github.sha }}" --generate-notes
